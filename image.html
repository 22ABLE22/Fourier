<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fourier-main-path" content="draw/">
    <title>Fourier Image Tracer</title>
    <style>
        :root {
            --bg:#f4f6f9; --card:#ffffff; --line:#e4e8ef; --line-soft:#eef1f6;
            --text:#1f2937; --muted:#6b7280; --brand:#4f46e5; --blue:#2563eb; --green:#10b981;
            --h1:#111827; --label:#4b5563; --hint:#b3bdcc;
            --btn-bg:#ffffff; --btn-border:#d5dbe4; --btn-text:#374151;
            --btn-hover-bg:#f6f8fb; --btn-hover-border:#c2cad7;
            --btn-off-bg:#f9fafb;
            --btn-on-bg:#f5f3ff; --btn-on-border:#c4b5fd; --btn-on-text:#4c1d95;
            --danger-text:#dc2626; --danger-border:#f2b8b5; --danger-hover-bg:#fef2f2; --danger-hover-border:#e9a09c;
            --preset-text:#6d28d9; --preset-border:#ddd6fe; --preset-hover-bg:#f5f3ff; --preset-hover-border:#c4b5fd;
            --input-bg:#ffffff; --input-border:#d5dbe4;
            --cell-bg:#f8fafc; --cell-label:#8b97a8;
            --note:#8b97a8; --footer:#9aa5b4;
        }
        :root[data-theme="dark"] {
            --bg:#0e1118; --card:#161b26; --line:#262d3d; --line-soft:#1f2634;
            --text:#e6eaf2; --muted:#9aa4b8;
            --h1:#f1f4fa; --label:#9aa4b8; --hint:#6b7590;
            --btn-bg:#1e2432; --btn-border:#2e3648; --btn-text:#cfd6e4;
            --btn-hover-bg:#242b3c; --btn-hover-border:#3a4358;
            --btn-off-bg:#1a1f2b;
            --btn-on-bg:#2a2640; --btn-on-border:#4c3f8a; --btn-on-text:#c4b5fd;
            --danger-text:#f87171; --danger-border:#5a2f33; --danger-hover-bg:#2a1a1c; --danger-hover-border:#7a3b3f;
            --preset-text:#b794f6; --preset-border:#3d3566; --preset-hover-bg:#241f3d; --preset-hover-border:#4c3f8a;
            --input-bg:#1a1f2b; --input-border:#2e3648;
            --cell-bg:#1b2130; --cell-label:#8791a6;
            --note:#8791a6; --footer:#7b869c;
        }
        @media (prefers-color-scheme: dark) { :root[data-theme="auto"] {
            --bg:#0e1118; --card:#161b26; --line:#262d3d; --line-soft:#1f2634;
            --text:#e6eaf2; --muted:#9aa4b8;
            --h1:#f1f4fa; --label:#9aa4b8; --hint:#6b7590;
            --btn-bg:#1e2432; --btn-border:#2e3648; --btn-text:#cfd6e4;
            --btn-hover-bg:#242b3c; --btn-hover-border:#3a4358;
            --btn-off-bg:#1a1f2b;
            --btn-on-bg:#2a2640; --btn-on-border:#4c3f8a; --btn-on-text:#c4b5fd;
            --danger-text:#f87171; --danger-border:#5a2f33; --danger-hover-bg:#2a1a1c; --danger-hover-border:#7a3b3f;
            --preset-text:#b794f6; --preset-border:#3d3566; --preset-hover-bg:#241f3d; --preset-hover-border:#4c3f8a;
            --input-bg:#1a1f2b; --input-border:#2e3648;
            --cell-bg:#1b2130; --cell-label:#8791a6;
            --note:#8791a6; --footer:#7b869c;
        } }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif; }
        html, body { height:100%; }
        body { background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased; }
        .app { height:100vh; max-width:1720px; margin:0 auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
        header { flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:10px 18px; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 2px rgba(16,24,40,0.05); }
        h1 { display:flex; align-items:center; gap:9px; font-size:1.12rem; font-weight:600; letter-spacing:-0.01em; color:var(--h1); }
        h1 .logo { display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#6366f1,#22d3ee); font-size:14px; line-height:1; }
        .head-right { display:flex; align-items:baseline; flex-wrap:wrap; gap:14px; }
        .subtitle { font-size:0.76rem; color:var(--muted); }
        .nav-link { font-size:0.76rem; color:var(--muted); text-decoration:none; transition:color .15s; }
        .nav-link:hover { color:var(--brand); }
        .btn-sm { padding:4px 10px; font-size:0.7rem; }
        .main-layout { flex:1 1 auto; min-height:0; display:flex; gap:10px; }
        .panel { display:flex; flex-direction:column; min-height:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; box-shadow:0 1px 2px rgba(16,24,40,0.05); }
        .panel h2 { flex:0 0 auto; display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:0.68rem; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); }
        .sidebar { flex:0 0 344px; gap:9px; overflow-y:auto; overflow-x:hidden; }
        .side-block { flex:0 0 auto; display:flex; flex-direction:column; min-height:0; }
        .stage { flex:1 1 auto; min-width:0; }
        .stage-head { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:9px; }
        .stage-head h2 { margin-bottom:0; }
        .canvas-wrap { position:relative; flex:1 1 auto; min-height:0; }
        .canvas-wrap canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:block; max-width:100%; max-height:100%; background:#fff; border-radius:10px; box-shadow:inset 0 0 0 1px var(--line-soft); cursor:crosshair; }
        .canvas-wrap canvas.panning { cursor:grabbing; }
        .drawing-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; padding:0 14px; text-align:center; font-size:0.82rem; line-height:1.55; color:var(--hint); pointer-events:none; }
        .stage-hint { font-size:0.92rem; }
        .controls { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
        button { padding:8px 14px; font-size:0.8rem; font-weight:500; color:var(--btn-text); background:var(--btn-bg); border:1px solid var(--btn-border); border-radius:8px; cursor:pointer; box-shadow:0 1px 2px rgba(16,24,40,0.04); transition:background .15s,border-color .15s,color .15s,transform .06s; }
        button:hover { background:var(--btn-hover-bg); border-color:var(--btn-hover-border); }
        button:active { transform:translateY(1px); }
        button[aria-pressed="true"] { background:var(--btn-on-bg); border-color:var(--btn-on-border); color:var(--btn-on-text); }
        button[aria-pressed="false"] { color:var(--muted); background:var(--btn-off-bg); }
        button.success { color:#fff; background:var(--green); border-color:var(--green); }
        button.success:hover { background:#0da271; border-color:#0da271; }
        button:disabled { opacity:0.55; cursor:not-allowed; }
        button.danger { color:var(--danger-text); border-color:var(--danger-border); }
        button.danger:hover { background:var(--danger-hover-bg); border-color:var(--danger-hover-border); }
        .preset-row { display:flex; flex-wrap:wrap; gap:6px; }
        .field-grid { display:grid; grid-template-columns:1fr; gap:9px; }
        .field-group { display:flex; flex-direction:column; gap:5px; }
        .field-group label { font-size:0.75rem; color:var(--label); }
        input[type="number"] { width:100%; padding:6px 9px; font-size:0.8rem; color:var(--text); background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; font-variant-numeric:tabular-nums; }
        input[type="number"]:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,0.14); }
        .range-row { display:flex; align-items:center; gap:8px; }
        .range-row input[type="range"] { flex:1 1 auto; accent-color:var(--brand); }
        .range-val { flex:0 0 auto; min-width:30px; text-align:right; font-size:0.75rem; color:var(--label); font-variant-numeric:tabular-nums; }
        .info-bar { flex:0 0 auto; display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-top:auto; padding-top:9px; }
        .info-cell { padding:6px 2px; text-align:center; background:var(--cell-bg); border:1px solid var(--line-soft); border-radius:9px; }
        .info-cell .label { font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--cell-label); }
        .info-cell .value { margin-top:2px; font-size:0.98rem; font-weight:600; color:var(--blue); font-variant-numeric:tabular-nums; }
        .info-cell .value.small { font-size:0.72rem; font-weight:500; color:var(--muted); }
        footer { flex:0 0 auto; text-align:center; font-size:0.69rem; color:var(--footer); }
        .toast { position:fixed; top:16px; left:50%; z-index:999; padding:9px 20px; font-size:0.82rem; color:#fff; background:#111827; border-radius:9px; box-shadow:0 8px 24px rgba(16,24,40,0.18); transform:translateX(-50%) translateY(-300%); transition:transform .35s cubic-bezier(.34,1.4,.64,1); pointer-events:none; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.error { background:#dc2626; }
        /* --- Page-specific additions for the image tracer --- */
        input[type="file"] { width:100%; padding:7px 9px; font-size:0.76rem; color:var(--text); background:var(--input-bg); border:1px dashed var(--input-border); border-radius:8px; }
        input[type="file"]::file-selector-button { padding:5px 11px; margin-right:10px; font-size:0.74rem; font-weight:500; color:var(--btn-text); background:var(--btn-bg); border:1px solid var(--btn-border); border-radius:6px; cursor:pointer; transition:background .15s,border-color .15s; }
        input[type="file"]::file-selector-button:hover { background:var(--btn-hover-bg); border-color:var(--btn-hover-border); }
        .chk-row { display:flex; align-items:center; gap:8px; font-size:0.76rem; color:var(--label); }
        .chk-row input[type="checkbox"] { width:15px; height:15px; accent-color:var(--brand); cursor:pointer; }
        .hint-row { font-size:0.68rem; color:var(--note); line-height:1.5; }
        .stage.drop-active { border-color:var(--brand); box-shadow:inset 0 0 0 2px rgba(79,70,229,0.35); }
        .stage.drop-active .drawing-hint { color:var(--brand); }
        @media (max-height:860px) { .app { padding:10px 14px; gap:8px; } .panel { padding:10px; } .panel h2 { margin-bottom:7px; } }
        @media (max-height:740px) { .sidebar { gap:7px; } .info-cell .value { font-size:0.9rem; } }
        @media (max-width:1240px) { .sidebar { flex:0 0 302px; } }
        @media (max-width:960px) { body { overflow:auto; } .app { height:auto; padding:12px; } header { flex-direction:column; align-items:flex-start; gap:3px; } .main-layout { flex-direction:column; } .sidebar { flex:0 0 auto; overflow:visible; } .stage { height:min(88vw,520px); } }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1><span class="logo">🖼</span>Fourier Image Tracer</h1>
            <div class="head-right">
                <a class="nav-link" href="draw/">← Main App</a>
                <button id="themeBtn" type="button" class="btn-sm">🌗 Auto</button>
            </div>
        </header>
        <div class="main-layout">
            <aside class="panel sidebar">
                <div class="side-block">
                    <h2>📷 Source</h2>
                    <input type="file" id="fileInput" accept="image/*">
                    <p class="hint-row">Or drop an image anywhere on the preview panel. Large images are downscaled to 1024px max side.</p>
                </div>
                <div class="side-block">
                    <h2>⚙️ Trace</h2>
                    <div class="field-grid">
                        <div class="field-group">
                            <label for="thresholdRange">Threshold (0-255)</label>
                            <div class="range-row">
                                <input type="range" id="thresholdRange" min="0" max="255" step="1" value="128">
                                <span id="thresholdVal" class="range-val">128</span>
                            </div>
                            <button id="autoThresholdBtn" type="button" class="btn-sm">Auto threshold (Otsu)</button>
                        </div>
                        <label class="chk-row"><input type="checkbox" id="invertChk"> Invert (dark background)</label>
                        <div class="field-group">
                            <label for="smoothRange">Smoothing (0-5)</label>
                            <div class="range-row">
                                <input type="range" id="smoothRange" min="0" max="5" step="1" value="2">
                                <span id="smoothVal" class="range-val">2</span>
                            </div>
                        </div>
                        <label class="chk-row"><input type="checkbox" id="maskChk" checked> Show mask</label>
                    </div>
                </div>
                <div class="side-block">
                    <button id="useBtn" class="success" disabled>✨ Use in Main App</button>
                </div>
                <div class="info-bar">
                    <div class="info-cell"><div class="label" title="Total number of traced contour points">Points</div><div id="infoPoints" class="value">0</div></div>
                    <div class="info-cell"><div class="label">Status</div><div id="infoStatus" class="value small">Ready</div></div>
                </div>
            </aside>
            <section class="panel stage" id="stage">
                <div class="stage-head">
                    <h2>🖌️ Trace Preview</h2>
                </div>
                <div class="canvas-wrap">
                    <canvas id="traceCanvas" width="600" height="600"></canvas>
                    <div id="stageHint" class="drawing-hint">Drop an image here or choose a file</div>
                </div>
            </section>
        </div>
        <footer>Fourier Series Visualization</footer>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/image.js"></script>
</body>
</html>
