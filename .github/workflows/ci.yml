name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: for file in js/*.js; do node --check "$file"; done
      - name: Run numerical tests
        run: node tests/fit.test.mjs
      - name: Check mirrored entry pages
        run: node tests/entry-drift.mjs
      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs
