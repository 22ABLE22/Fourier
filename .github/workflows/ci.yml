name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The smoke check must fail, not skip, when no browser is available.
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: for file in js/*.js; do node --check "$file"; done
      - name: Run numerical tests
        run: node tests/fit.test.mjs
      - name: Check mirrored entry pages
        run: node tests/entry-drift.mjs
      - name: Install headless Chromium
        run: |
          npx --yes playwright@1.47.2 install --with-deps chromium
      - name: Run browser smoke tests
        run: |
          BROWSER=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -n 1)
          if [ -z "$BROWSER" ]; then
            echo "Chromium was not installed by Playwright" >&2
            exit 1
          fi
          EDGE_PATH="$BROWSER" node tests/browser-smoke.mjs
